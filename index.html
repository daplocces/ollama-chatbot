<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand"><span>My Chatbot</span></div>
        <div class="sidebar-tools">
          <button id="newConversation" class="new-chat" type="button">New</button>
        </div>
        <nav id="conversationList" aria-label="Conversations"></nav>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-header-copy">
            <h1 id="activeConversationTitle">New chat</h1>
          </div>
        </header>
        <section id="messages" aria-live="polite"></section>
        <form id="chatForm">
          <input id="messageInput" placeholder="Message your chatbot..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="src/conversations.js"></script>
    <script src="src/message-actions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
